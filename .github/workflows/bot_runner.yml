name: Pull&Bear Restock Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Runs automatically every 4 hours to ensure continuous 24/7 monitoring
    - cron: '0 */4 * * *'

concurrency:
  group: bot-runner
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max 5.8 hours per run

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar Google Chrome
        run: |
          google-chrome --version

      - name: Instalar dependencias Python
        run: |
          pip install --no-cache-dir selenium requests

      - name: Ejecutar Bot de Restock
        run: |
          python bot.py
