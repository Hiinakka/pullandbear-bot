services:
  pullandbear-bot:
    build: .
    container_name: pullandbear_restock_bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json
      - ./chrome_profile:/app/chrome_profile
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
